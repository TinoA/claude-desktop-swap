name: Bug report
description: Report a reproducible Claude Desktop Switcher problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach `.csb` backups, Claude data folders, cookies, tokens, or `.claude-swap` profile files.
  - type: input
    id: version
    attributes:
      label: Claude Desktop Switcher version
      placeholder: v0.5.0
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the tray menu
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Safe diagnostic context
      description: State whether Claude Desktop was open or closed and how many profiles existed. Redact private account data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include session data, tokens, cookies, or backup files.
          required: true
